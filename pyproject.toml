[project]
name = "atst"
version = "1.0"
description = "Assay Time Series Tabular format utils."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pandas>=2.3.3,<3; python_version < '3.11'",
    "pandas>=3.0.3; python_version >= '3.11'",
    "pytz>=2026.2",
    "streamlit[charts]>=1.58.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
atst = { workspace = true }

[dependency-groups]
dev = [
    "atst",
]

[tool.ruff.lint]
ignore = ["E731", "E501", "I001"]

[tool.coverage.run]
omit = ["src/streamlit_app/*"]
